name: ContaOS Frontend Zero-Drift
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: frontend-zero-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: ContaOS Frontend Zero-Drift
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout immutable commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: P0 PRIORIDADE ZERO — 14 testes de sequência e certificação por versão
        run: node --test scripts/p0-version-order-gate.test.mjs
      - name: P0 V1 — autotestes do inventario e dispensas
        run: node --test scripts/p0-v1-traceability-gate.test.mjs
      - name: P0 V1 — integridade dos 416 critérios, 45 prompts e 37 atomicos
        run: node scripts/p0-v1-traceability-gate.mjs
      - name: P0 PRIORIDADE ZERO — proibir avançar V2 antes de certificar V1
        env:
          FRONTEND_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/p0-version-order-gate.mjs
      - name: P0 LIVE — testes negativos de proveniencia PR/review/CI
        run: node --test scripts/p0-evidence-live-gate.test.mjs
      - name: P0 LIVE — auditar GitHub real para cada certificado PASS
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/p0-evidence-live-gate.mjs
      - name: P0 RCA V1-V5 — testes negativos de causa raiz e impacto
        run: node --test scripts/p0-rca-impact-gate.test.mjs
      - name: Autoteste do guard (casos permitidos e proibidos)
        run: node --test scripts/frontend-scope-gate.test.mjs
      - name: Verificar contrato de seguranca do Auto-Lock por PR
        run: node --test scripts/types-autolock-workflow.test.mjs
      - name: Verificar fronteira frontend/backend e PLAN validado prévio
        env:
          FRONTEND_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/frontend-scope-gate.mjs
      - name: Autotestes do snapshot canônico e matriz de telas
        run: node --test scripts/context-freshness-gate.test.mjs scripts/testc/visual-audit.test.mjs
      - name: Verificar HEAD vivo do repositório normativo antes de BUILD
        env:
          FRONTEND_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CONTAOS_CANONICAL_READ_TOKEN: ${{ secrets.CONTAOS_CANONICAL_READ_TOKEN }}
        run: node scripts/context-freshness-gate.mjs
      - name: GOV-003 — exigir token valido e fonte viva antes do merge
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'governance/gov-003-') }}
        env:
          CONTAOS_FORCE_CANONICAL_CHECK: "1"
          CONTAOS_CANONICAL_READ_TOKEN: ${{ secrets.CONTAOS_CANONICAL_READ_TOKEN }}
        run: |
          node scripts/context-freshness-gate.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Setup Bun
        run: |
          node --test scripts/ci/install-pinned-bun.test.mjs
          node scripts/ci/install-pinned-bun.mjs
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: P0 RCA V1-V5 — verificar escopo, RED GitHub e executar GREEN/REG reais
        env:
          FRONTEND_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
          CONTAOS_CANONICAL_READ_TOKEN: ${{ secrets.CONTAOS_CANONICAL_READ_TOKEN }}
        run: node scripts/p0-rca-impact-gate.mjs
      - name: GOV-020 — autotestes de rota limpa, alterada, excluída e não versionada
        run: node --test scripts/route-tree-drift-gate.test.mjs
      - name: Lint e formatacao do saneamento transversal
        run: |
          bunx eslint src/routes/__root.tsx src/components/brand/ContaOSMarca.tsx src/test/rootLocale.test.tsx src/test/brand.test.tsx scripts/frontend-zero-drift.mjs scripts/frontend-scope-gate.mjs scripts/context-freshness-gate.mjs scripts/context-freshness-gate.test.mjs scripts/testc/visual-audit.mjs scripts/testc/visual-audit.test.mjs scripts/route-tree-drift-gate.mjs scripts/route-tree-drift-gate.test.mjs
          bunx prettier --check scripts/frontend-zero-drift.mjs src/test/brand.test.tsx src/test/rootLocale.test.tsx scripts/route-tree-drift-gate.mjs scripts/route-tree-drift-gate.test.mjs
      - name: Production build — geração canônica TanStack antes dos testes longos
        run: bunx vite build
      - name: GOV-020 — bloquear divergência entre routeTree gerado e commit
        run: node scripts/route-tree-drift-gate.mjs
      - name: Full regression — Vitest 2 workers
        run: bunx vitest run --maxWorkers=2
      - name: TypeScript typecheck
        run: bunx tsc --noEmit -p .
      - name: Brand-01, PT-BR, secrets and types integrity
        run: node scripts/frontend-zero-drift.mjs

  teste-c:
    # GOV-018: runner isolado, mesmo commit; CI de qualidade e Teste C em paralelo.
    # Ambos continuam checks obrigatorios no ruleset da main.
    name: Auditoria de navegador independente (somente leitura)
    uses: ./.github/workflows/contaos-teste-c-independente.yml
    permissions:
      contents: read
