name: ContaOS Types Auto-Lock
on:
  push:
    branches: [main]
    paths:
      - 'src/integrations/supabase/types.ts'
      - '.github/workflows/contaos-types-autolock.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

# O bot não altera main diretamente e nunca faz aprovação ou merge automático.
# 'actions: write' é necessário apenas para disparar CI na branch do PR;
# PRs criados por GITHUB_TOKEN não disparam workflows pull_request automaticamente.
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: contaos-types-autolock-main
  cancel-in-progress: false
jobs:
  protect-types:
    name: Abrir PR para restaurar types.ts certificado quando houver drift
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LOCKED_PATH: src/integrations/supabase/types.ts
      CERTIFIED_SOURCE_COMMIT: ad0b933943d4b69f7a9f23f203e4cff1211b4902
      CERTIFIED_TYPES_BLOB: 8ea7750b75fd9d76b29c36ce7613392e3ab65e19
    steps:
      - name: Checkout completo da branch homologacao
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Teste isolado da trava e fonte certificada
        shell: bash
        run: |
          set -euo pipefail
          golden="$(mktemp)"
          fixture="$(mktemp)"
          trap 'rm -f "$golden" "$fixture"' EXIT
          git show "$CERTIFIED_SOURCE_COMMIT:$LOCKED_PATH" > "$golden"
          [[ "$(git hash-object "$golden")" == "$CERTIFIED_TYPES_BLOB" ]]
          cp "$golden" "$fixture"
          printf '%s' '// DRIFT_CONTROLADO_APENAS_EM_TMP' >> "$fixture"
          [[ "$(git hash-object "$fixture")" != "$CERTIFIED_TYPES_BLOB" ]]
          cp "$golden" "$fixture"
          [[ "$(git hash-object "$fixture")" == "$CERTIFIED_TYPES_BLOB" ]]
          echo 'LOCK-TYPES-01: fixture de deteccao e restauro PASS, branch intacta.'
      - name: Detectar drift em main
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C types-autolock origin/main
          actual="$(git hash-object "$LOCKED_PATH")"
          echo "current_blob=$actual" >> "$GITHUB_OUTPUT"
          if [[ "$actual" != "$CERTIFIED_TYPES_BLOB" ]]; then
            echo 'drift=true' >> "$GITHUB_OUTPUT"
            echo "DRIFT DETECTADO: $actual; criar proposta de reparo via PR."
          else
            echo 'drift=false' >> "$GITHUB_OUTPUT"
            echo 'LOCK-TYPES-01: arquivo ja integro na main.'
          fi
      - name: Setup Bun apenas quando houver drift
        if: steps.detect.outputs.drift == 'true'
        uses: oven-sh/setup-bun@v2
      - name: Preparar reparo certificado e abrir PR sem merge automatico
        if: steps.detect.outputs.drift == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          golden="$(mktemp)"
          trap 'rm -f "$golden"' EXIT
          git show "$CERTIFIED_SOURCE_COMMIT:$LOCKED_PATH" > "$golden"
          [[ "$(git hash-object "$golden")" == "$CERTIFIED_TYPES_BLOB" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Um PR de reparo aberto deve passar pelo CI; nao duplicar nem mesclar automaticamente.
          existing="$(gh pr list --state open --base main --json headRefName,number --jq '[.[] | select(.headRefName | startswith("autolock/types-certified-"))] | length')"
          if (( existing > 0 )); then
            echo "JA EXISTE PR de restauro pendente ($existing). Conferir CI; nenhuma escrita."
            exit 0
          fi

          git fetch origin main
          git switch -C types-autolock origin/main
          if [[ "$(git hash-object "$LOCKED_PATH")" == "$CERTIFIED_TYPES_BLOB" ]]; then
            echo 'Outro processo restaurou o arquivo; nenhuma escrita.'
            exit 0
          fi
          repair_count="$(git log --since='60 minutes ago' --format='%s' | grep -c '^fix(types-autolock): restaurar blob imutavel$' || true)"
          if (( repair_count >= 3 )); then
            echo 'CIRCUIT BREAKER: tres restauracoes na ultima hora; requer revisao humana.' >&2
            exit 1
          fi

          main_before="$(git rev-parse origin/main)"
          cp "$golden" "$LOCKED_PATH"
          [[ "$(git hash-object "$LOCKED_PATH")" == "$CERTIFIED_TYPES_BLOB" ]]
          node scripts/frontend-zero-drift.mjs
          bun install --frozen-lockfile
          bunx vitest run --maxWorkers=1
          bunx tsc --noEmit -p .
          bunx vite build
          node scripts/frontend-zero-drift.mjs
          git add -- "$LOCKED_PATH"
          git commit -m 'fix(types-autolock): restaurar blob imutavel'

          # Se a base mudou durante os testes, falhar fechado em vez de PR obsoleto.
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$main_before" ]]; then
            echo 'MAIN ALTERADA durante a suite. Nenhuma escrita; reexecutar o Auto-Lock.' >&2
            exit 1
          fi

          repair_branch="autolock/types-certified-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git push origin "HEAD:refs/heads/$repair_branch"
          gh pr create --base main --head "$repair_branch" \
            --title 'fix(types-autolock): propor restauro do blob certificado' \
            --body "Reparo restrito a src/integrations/supabase/types.ts, restaurado ao blob certificado \`$CERTIFIED_TYPES_BLOB\`. Testes executados antes da publicação. Sem aprovação humana obrigatória (0 revisões); exigir CI verde e ruleset, sem bypass e sem merge automático pelo bot. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo 'PR de reparo aberto, sem merge nem bypass da main.'

          # GITHUB_TOKEN não dispara CI pull_request para PR que ele próprio cria.
          # Disparar workflow_dispatch somente na branch do reparo.
          gh workflow run contaos-frontend-zero-drift.yml --ref "$repair_branch"
          echo 'CI Zero-Drift solicitado na mesma branch; conferir os checks no PR.'

  probe-recovery:
    name: Ensaio isolado de PR de recuperacao
    # O teste é executado uma vez após o merge GOV-011, sem drift em main.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'GOV-011') }}
    needs: protect-types
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LOCKED_PATH: src/integrations/supabase/types.ts
      CERTIFIED_SOURCE_COMMIT: ad0b933943d4b69f7a9f23f203e4cff1211b4902
      CERTIFIED_TYPES_BLOB: 8ea7750b75fd9d76b29c36ce7613392e3ab65e19
    steps:
      - name: Checkout main somente como origem dos testes
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Criar PR real por GITHUB_TOKEN em duas branches descartaveis
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          main_before="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$(git hash-object "$LOCKED_PATH")" == "$CERTIFIED_TYPES_BLOB" ]]
          drift_branch="autolock/probe-drift-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          repair_branch="autolock/probe-repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pr_number=""
          cleanup() {
            set +e
            if [[ -n "$pr_number" ]]; then
              gh pr close "$pr_number" --comment 'GOV-011: fim de ensaio isolado; sem merge.' || true
            fi
            git push origin --delete "$repair_branch" || true
            git push origin --delete "$drift_branch" || true
            echo 'GOV-011: limpeza das branches descartaveis solicitada.'
          }
          trap cleanup EXIT

          git fetch origin main
          git switch -c "$drift_branch" origin/main
          printf '\n// GOV011_DRIFT_SIMULADO_SOMENTE_BRANCH_DESCARTAVEL\n' >> "$LOCKED_PATH"
          [[ "$(git hash-object "$LOCKED_PATH")" != "$CERTIFIED_TYPES_BLOB" ]]
          git add -- "$LOCKED_PATH"
          git commit -m 'test(gov-011): drift somente na branch isolada'
          git push origin "HEAD:refs/heads/$drift_branch"

          git switch -c "$repair_branch" "$drift_branch"
          git show "$CERTIFIED_SOURCE_COMMIT:$LOCKED_PATH" > "$LOCKED_PATH"
          [[ "$(git hash-object "$LOCKED_PATH")" == "$CERTIFIED_TYPES_BLOB" ]]
          git add -- "$LOCKED_PATH"
          git commit -m 'fix(types-autolock): restaurar blob imutavel na prova isolada'
          git push origin "HEAD:refs/heads/$repair_branch"

          gh pr create --base "$drift_branch" --head "$repair_branch" \
            --title 'GOV-011: PR real temporario de reparo Auto-Lock' \
            --body 'Ensaio do GITHUB_TOKEN. Base e head sao branches descartaveis. Nao mesclar. O bot fecha este PR e limpa as branches.'
          pr_number="$(gh pr view "$repair_branch" --json number --jq '.number')"
          [[ "$pr_number" =~ ^[0-9]+$ ]]
          [[ "$(gh pr view "$pr_number" --json baseRefName --jq '.baseRefName')" == "$drift_branch" ]]
          [[ "$(gh pr view "$pr_number" --json headRefName --jq '.headRefName')" == "$repair_branch" ]]
          gh pr view "$pr_number" --json author --jq '.author.login' | grep -F 'github-actions'
          [[ "$(gh pr diff "$pr_number" --name-only)" == "$LOCKED_PATH" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$main_before" ]]
          echo "GOV-011 AUTOLOCK_PROBE_PASS: PR #$pr_number aberto pelo bot e somente $LOCKED_PATH restaurado."
          echo 'GOV-011: PR nao mesclado; main permaneceu inalterada.'
