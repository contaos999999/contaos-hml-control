name: P0 #864 - RED causal focal temporario
on:
  pull_request:
    branches: [main]
    paths:
      - "src/test/selecionarOrganizacao.test.tsx"
      - ".github/workflows/p0-864-causal-red.yml"
permissions:
  contents: read
jobs:
  causal-red:
    if: github.event.pull_request.number == 866 && github.event.pull_request.head.repo.full_name == github.repository
    name: P0-864 causal RED real selector
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Provar HEAD e PLAN integrado
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          git show "$EXPECTED_BASE:docs/frontend/planos/P0_GOV_PLAN_866.json"
          git diff --name-only "$EXPECTED_BASE" HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Bun fixado
        run: |
          node --test scripts/ci/install-pinned-bun.test.mjs
          node scripts/ci/install-pinned-bun.mjs
      - run: bun install --frozen-lockfile
      - name: RED causal do seletor real
        run: bunx vitest run src/test/selecionarOrganizacao.test.tsx --reporter=verbose
