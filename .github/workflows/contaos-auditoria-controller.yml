  # Separate non-required gate for release of the INTERNAL pre-certification.
  # This is an assistant-authored pre-audit, never the independent Codex review.
  assistant-preaudit-gate:
    name: P0-ABS Preauditoria Assistente (precert apenas)
    if: ((github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && github.event.pull_request.number == 690) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/build/p0-abs-fiscal-universal')
    needs: [controller-offline, adversarial-v2]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout da PR para verificador sem credenciais persistentes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Revalidar LIVE parecer/CI/artifact no exato instante de consumo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_PREAUDIT_PR: "690"
          INPUT_PREAUDIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          INPUT_PREAUDIT_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          echo "PRÉ-CERTIFICAÇÃO BLOQUEADA até parecer PASS do assistente."
          for attempt in $(seq 1 24); do
            if node scripts/p0-rca-impact-gate.mjs --verify-assistant-preaudit; then
              echo "P0 ASSISTENTE PASS autenticado. PRÉ-CERTIFICAÇÃO INTERNA LIBERADA."
              echo "AUDITORIA INDEPENDENTE, APPROVED, MERGE e ATIVAÇÃO continuam pendentes."
              exit 0
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "CHANGES_REQUESTED/BLOCKED: sem PASS íntegro neste HEAD."
              exit 1
            fi
            sleep 45
          done
