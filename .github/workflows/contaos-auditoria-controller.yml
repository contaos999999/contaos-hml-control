  # Separate non-required gate for release of the INTERNAL pre-certification.
  # This is an assistant-authored pre-audit, never the independent Codex review.
  assistant-preaudit-gate:
    name: P0-ABS Preauditoria Assistente (precert apenas)
    if: ((github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && github.event.pull_request.number == 690) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/build/p0-abs-fiscal-universal')
    needs: [controller-offline, adversarial-v2]
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - name: Checkout da PR para verificador sem credenciais persistentes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Revalidar LIVE parecer/CI/artifact no exato instante de consumo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_PREAUDIT_PR: "690"
          INPUT_PREAUDIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          INPUT_PREAUDIT_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          echo "PRÉ-CERTIFICAÇÃO BLOQUEADA até parecer PASS do assistente."
          for attempt in $(seq 1 10); do
            if output=$(node scripts/p0-rca-impact-gate.mjs --verify-assistant-preaudit 2>&1); then
              echo "$output"
              echo "P0 ASSISTENTE PASS autenticado. PRÉ-CERTIFICAÇÃO INTERNA LIBERADA."
              echo "AUDITORIA INDEPENDENTE, APPROVED, MERGE e ATIVAÇÃO continuam pendentes."
              exit 0
            fi
            echo "$output"
            # A primary rate-limit 403 is a transient EXTERNAL blocker.
            # Honor GitHub's authenticated reset epoch. Never pretend PASS.
            if echo "$output" | grep -Eq 'GitHub HTTP (403|429).* remaining=0 reset-at=[0-9]{10}'; then
              reset=$(printf '%s\n' "$output" | sed -nE 's/.*reset-at=([0-9]{10}).*/\1/p' | tail -n 1)
              now=$(date -u +%s)
              delay=$((reset - now + 10))
              if [ "$delay" -lt 15 ]; then delay=15; fi
              if [ "$delay" -gt 3900 ]; then
                echo "P0-ABS BLOCKED_EXTERNAL: reset alem da janela segura."
                exit 1
              fi
              echo "P0-ABS BLOCKED_EXTERNAL: limite GitHub esgotado, retomada somente apos reset autenticado."
              sleep "$delay"
              continue
            fi
            # Permission denials, invalid causal RED or missing authenticated
            # steps need a correction, never 24 blind retries.
            if echo "$output" | grep -Eq 'GitHub HTTP (401|403)|NR-006: RED causal|25 provas executaveis'; then
              echo "P0-ABS BLOCKED: impedimento tecnico/permissao; nova revisao necessaria."
              exit 1
            fi
            # Terminal failures must never be recycled as CI pending.
            # Only pending checks or a still-unpublished current-HEAD receipt
            # may enter the bounded wait loop.
            if echo "$output" | grep -Fq '"waitable":false'; then
              echo "P0-ABS CHANGES_REQUESTED: impedimento terminal, sem retries cegos."
              exit 1
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "CHANGES_REQUESTED/BLOCKED: sem PASS íntegro neste HEAD."
              exit 1
            fi
            sleep 45
          done
