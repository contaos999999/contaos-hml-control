name: ContaOS F4 CODE - primeiro lote material ADM01

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/test/f4-code-adm01-version-sync.test.ts"
      - ".github/workflows/contaos-f4-code-material.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  material:
    name: F4 CODE ADM01 - material e readback
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Instalar Bun fixado
        run: |
          node --test scripts/ci/install-pinned-bun.test.mjs
          node scripts/ci/install-pinned-bun.mjs
      - run: bun install --frozen-lockfile
      - name: Executar testes materiais
        env:
          F4_CODE_ADM01_OBSERVATIONS: artifacts/f4-code/observations.json
        run: |
          mkdir -p artifacts/f4-code
          bunx vitest run src/test/f4-code-adm01-version-sync.test.ts --reporter=json --outputFile=artifacts/f4-code/vitest.json
      - name: Conferir resultados e identidade real
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JOB_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="F4 CODE ADM01 - material e readback") | .id')"
          export JOB_ID
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const d = "artifacts/f4-code/";
          const o = JSON.parse(fs.readFileSync(d+"observations.json", "utf8"));
          const v = JSON.parse(fs.readFileSync(d+"vitest.json", "utf8"));
          const ids = new Set(o.map(x=>x.caseId));
          if (o.length!==50 || ids.size!==25 || new Set(o.map(x=>x.caseId+":"+x.kind)).size!==50 || o.some(x=>!["positive","negative"].includes(x.kind)||x.mode!=="CODE_FIXTURE"||!x.readback)) throw Error("incomplete observations");
          if (v.numPassedTests!==50 || v.numFailedTests!==0 || v.numPendingTests!==0 || v.numTotalTests!==50 || !v.success) throw Error("test execution incomplete");
          for (const x of o) {
            if (!v.testResults.flatMap(r=>r.assertionResults).some(t=>t.status==="passed"&&t.title.startsWith(x.caseId+" "+x.kind+":"))) throw Error("missing named test");
          }
          if (!/^[1-9][0-9]*$/.test(process.env.JOB_ID??"")) throw Error("missing job identity");
          fs.writeFileSync(d+"receipt.json", JSON.stringify({schema:"contaos.ifv1.f4.material-partial.v1",scope:"ADM01_CODE_FIXTURE",sha:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,job:process.env.JOB_ID,covered:25,proofs:50,phaseTotal:138,certification:"NOT_CERTIFIED"},null,2)+"\n");
          JS
          cd artifacts/f4-code
          sha256sum observations.json vitest.json receipt.json > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Preservar relatorios e observacoes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f4-code-adm01-${{ github.sha }}
          path: artifacts/f4-code/
          if-no-files-found: warn
          retention-days: 30
