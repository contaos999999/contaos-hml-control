name: CSDI Structural Validator Tests
on:
  pull_request:
    paths:
      - 'scripts/csdi-receipt-validator.mjs'
      - 'scripts/csdi-receipt-validator.test.mjs'
      - 'scripts/csdi-live-consumer.mjs'
      - 'scripts/csdi-live-consumer.test.mjs'
      - '.github/workflows/csdi-structural-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  csdi-structural-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run CSDI structural regression tests
        run: node --test scripts/csdi-receipt-validator.test.mjs scripts/csdi-live-consumer.test.mjs
      - name: Check default fail-closed behavior
        shell: bash
        run: |
          set +e
          node scripts/csdi-receipt-validator.mjs /nonexistent/receipt.json > /tmp/csdi-blocked.json
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q '"verdict":"BLOCKED"' /tmp/csdi-blocked.json
