name: ContaOS HML Authenticated Counterproofs
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trilha-a-authenticated-hml
  cancel-in-progress: false
jobs:
  authenticated-hml:
    name: Authenticated HML counterproofs (NO-GO on missing prerequisites)
    # HML secrets MUST never be exposed to dispatches from non-main branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: hml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: RED/GREEN deterministic integrity regressions (no credentials)
        run: node --test scripts/hml-counterproofs/guard.test.mjs scripts/hml-counterproofs/fixture-attestation.test.mjs
      - name: Install pinned Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Prove both existing synthetic identities and bilateral real RLS in HML
        id: live_fixture
        env:
          CONTAOS_HML_SYNTHETIC_EMAIL: ${{ secrets.CONTAOS_HML_SYNTHETIC_EMAIL }}
          CONTAOS_HML_SYNTHETIC_PASSWORD: ${{ secrets.CONTAOS_HML_SYNTHETIC_PASSWORD }}
          CONTAOS_HML_SYNTHETIC_2_EMAIL: ${{ secrets.CONTAOS_HML_SYNTHETIC_2_EMAIL }}
          CONTAOS_HML_SYNTHETIC_2_PASSWORD: ${{ secrets.CONTAOS_HML_SYNTHETIC_2_PASSWORD }}
        run: node scripts/hml-counterproofs/fixture-attestation.mjs
      - name: HML authenticated preflight (fail closed, live attestation required)
        env:
          CONTAOS_HML_FRONTEND_URL: ${{ vars.CONTAOS_HML_FRONTEND_URL }}
          CONTAOS_HML_ALLOWED_HOST: ${{ vars.CONTAOS_HML_ALLOWED_HOST }}
          CONTAOS_HML_EXPECTED_FRONTEND_SHA: ${{ github.sha }}
          CONTAOS_HML_EXPECTED_BACKEND_SHA: ${{ vars.CONTAOS_HML_EXPECTED_BACKEND_SHA }}
          CONTAOS_HML_USER_A_EMAIL: ${{ secrets.CONTAOS_HML_SYNTHETIC_EMAIL }}
          CONTAOS_HML_USER_A_PASSWORD: ${{ secrets.CONTAOS_HML_SYNTHETIC_PASSWORD }}
          CONTAOS_HML_USER_B_EMAIL: ${{ secrets.CONTAOS_HML_SYNTHETIC_2_EMAIL }}
          CONTAOS_HML_USER_B_PASSWORD: ${{ secrets.CONTAOS_HML_SYNTHETIC_2_PASSWORD }}
        run: node scripts/hml-counterproofs/guard.mjs
      - name: Real HML browser counterproofs
        id: hml
        env:
          CONTAOS_HML_FRONTEND_URL: ${{ vars.CONTAOS_HML_FRONTEND_URL }}
          CONTAOS_HML_ALLOWED_HOST: ${{ vars.CONTAOS_HML_ALLOWED_HOST }}
          CONTAOS_HML_EXPECTED_FRONTEND_SHA: ${{ github.sha }}
          CONTAOS_HML_EXPECTED_BACKEND_SHA: ${{ vars.CONTAOS_HML_EXPECTED_BACKEND_SHA }}
          CONTAOS_HML_USER_A_EMAIL: ${{ secrets.CONTAOS_HML_SYNTHETIC_EMAIL }}
          CONTAOS_HML_USER_A_PASSWORD: ${{ secrets.CONTAOS_HML_SYNTHETIC_PASSWORD }}
          CONTAOS_HML_USER_B_EMAIL: ${{ secrets.CONTAOS_HML_SYNTHETIC_2_EMAIL }}
          CONTAOS_HML_USER_B_PASSWORD: ${{ secrets.CONTAOS_HML_SYNTHETIC_2_PASSWORD }}
        shell: bash
        run: |
          set +e
          bunx playwright test --config=playwright.hml-counterproofs.config.ts
          code=$?
          echo "CONTAOS_HML_TEST_EXIT=$code" >> "$GITHUB_ENV"
          exit "$code"
      - name: Immutable SHA-linked sanitized receipt
        if: always()
        env:
          CONTAOS_HML_EXPECTED_BACKEND_SHA: ${{ vars.CONTAOS_HML_EXPECTED_BACKEND_SHA }}
        run: node scripts/hml-counterproofs/receipt.mjs
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hml-counterproofs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/hml-counterproofs/receipt.json
            artifacts/hml-counterproofs/SHA256SUMS
            artifacts/hml-counterproofs/fixture-attestation.json
            artifacts/hml-counterproofs/fixture-attestation.SHA256
          if-no-files-found: error
          retention-days: 90
