name: ContaOS Trilha A Autenticada
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ci/install-pinned-bun.mjs"
      - "scripts/ci/install-pinned-bun.test.mjs"
      - scripts/hml/authenticated-visual-audit.mjs
      - scripts/hml/authenticated-visual-audit.test.mjs
      - .github/workflows/contaos-trilha-a-authenticated.yml
      - package.json
      - bun.lock
  workflow_run:
    workflows: ["ContaOS Frontend Zero-Drift"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      frontend_sha:
        description: Opcional, junto com deployment_id; vazio descobre HML atual antes do checkout
        required: false
        type: string
      deployment_id:
        description: Opcional, junto com frontend_sha; pin obsoleto bloqueia sem substituicao
        required: false
        type: string
permissions:
  contents: read
jobs:
  request:
    if: github.event_name == 'workflow_run' && github.repository == 'contaos999999/contaos-hml-control' && github.event.action == 'completed' && github.event.workflow_run.event == 'push' && github.event.workflow_run.repository.full_name == 'contaos999999/contaos-hml-control' && github.event.workflow_run.head_repository.full_name == 'contaos999999/contaos-hml-control' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.workflow_id == 406076025 && github.event.workflow_run.path == '.github/workflows/contaos-frontend-zero-drift.yml' && github.event.workflow_run.name == 'ContaOS Frontend Zero-Drift' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.run_attempt == 1 && github.run_attempt == '1' && github.event.workflow_run.head_sha == github.sha
    name: Trilha A solicitacao unica sem credenciais
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      selected: ${{ steps.request.outputs.selected }}
      sha: ${{ steps.request.outputs.sha }}
      frontend_sha: ${{ steps.request.outputs.frontend_sha }}
      deployment_id: ${{ steps.request.outputs.deployment_id }}
    env:
      CONTAOS_HARNESS_SHA: ${{ github.event.workflow_run.head_sha }}
      CONTAOS_REQUEST_OPERATION: audit
    steps:
      - name: Bootstrap publico confiavel antes de checkout ou token
        env:
          CONTAOS_REQUESTED_EXECUTOR_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node --input-type=module - <<'JS'
          const sha=process.env.CONTAOS_REQUESTED_EXECUTOR_SHA;
          if(!/^[a-f0-9]{40}$/.test(sha||""))process.exit(1);
          const response=await fetch("https://api.github.com/repos/contaos999999/contaos-hml-control/git/ref/heads/main",{redirect:"error",signal:AbortSignal.timeout(5000),headers:{Accept:"application/vnd.github+json"}});
          if(response.status!==200)process.exit(1);
          const body=await response.json();
          if(body.ref!=="refs/heads/main"||body.object?.sha!==sha)process.exit(1);
          JS
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          node --test scripts/ci/install-pinned-bun.test.mjs
          node scripts/ci/install-pinned-bun.mjs
      - run: bun install --frozen-lockfile
      - name: Provar evento e unicidade somente em metadados Actions
        id: request
        env:
          CONTAOS_ACTIONS_READ_TOKEN: ${{ github.token }}
        run: node scripts/hml/authenticated-visual-audit.mjs --request-preflight
  protocol:
    if: github.event_name == 'pull_request'
    name: Trilha A protocolo e Chromium sem credenciais
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    concurrency:
      group: trilha-a-protocolo-${{ github.ref }}
      cancel-in-progress: false
    env:
      CONTAOS_HARNESS_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          node --test scripts/ci/install-pinned-bun.test.mjs
          node scripts/ci/install-pinned-bun.mjs
      - run: bun install --frozen-lockfile
      - name: Protocolo sem environment ou secrets
        run: node --test scripts/hml/authenticated-visual-audit.test.mjs
      - name: Lint e formato somente dos arquivos novos
        run: |
          bunx eslint scripts/hml/authenticated-visual-audit.mjs scripts/hml/authenticated-visual-audit.test.mjs
          bunx prettier --check scripts/hml/authenticated-visual-audit.mjs scripts/hml/authenticated-visual-audit.test.mjs .github/workflows/contaos-trilha-a-authenticated.yml
      - name: Cache do Chromium congelado
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: trilha-a-ubuntu22-playwright-1.58.2-1208
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Comprovar novo comando e atestado nativo completo, sem credenciais
        run: node scripts/hml/authenticated-visual-audit.mjs --native-guard
  private:
    needs: request
    permissions:
      contents: read
      actions: read
      pull-requests: read
    if: always() && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || ((github.event_name == 'workflow_run' && github.repository == 'contaos999999/contaos-hml-control' && github.event.action == 'completed' && github.event.workflow_run.event == 'push' && github.event.workflow_run.repository.full_name == 'contaos999999/contaos-hml-control' && github.event.workflow_run.head_repository.full_name == 'contaos999999/contaos-hml-control' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.workflow_id == 406076025 && github.event.workflow_run.path == '.github/workflows/contaos-frontend-zero-drift.yml' && github.event.workflow_run.name == 'ContaOS Frontend Zero-Drift' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.run_attempt == 1 && github.run_attempt == '1' && github.event.workflow_run.head_sha == github.sha) && needs.request.outputs.selected == 'true'))
    name: Trilha A auditoria privada HML
    runs-on: ubuntu-22.04
    environment: hml
    timeout-minutes: 80
    concurrency:
      group: trilha-a-authenticated-hml
      cancel-in-progress: false
    env:
      CONTAOS_REQUEST_OPERATION: audit
      CONTAOS_HARNESS_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CONTAOS_FRONTEND_SOURCE: ${{ github.workspace }}/frontend-source
    steps:
      - name: Checkout imutavel do executor main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          node --test scripts/ci/install-pinned-bun.test.mjs
          node scripts/ci/install-pinned-bun.mjs
      - name: Dependencias congeladas do executor
        run: bun install --frozen-lockfile
      - name: Recibo inicial publico para as fases sem credenciais
        if: github.event_name == 'workflow_run'
        env:
          CONTAOS_ACTIONS_READ_TOKEN: ${{ github.token }}
        run: node scripts/hml/authenticated-visual-audit.mjs --request-revalidate
      - name: Reancorar deployment HML sem credenciais, antes do checkout da fonte
        id: deployment
        env:
          CONTAOS_REQUESTED_FRONTEND_SHA: ${{ github.event_name == 'workflow_run' && needs.request.outputs.frontend_sha || inputs.frontend_sha }}
          CONTAOS_REQUESTED_DEPLOYMENT_ID: ${{ github.event_name == 'workflow_run' && needs.request.outputs.deployment_id || inputs.deployment_id }}
        run: node scripts/hml/authenticated-visual-audit.mjs --resolve-deployment
      - name: Validar SHA ancestral antes de baixar ou executar a fonte
        run: |
          node --input-type=module - <<'JS'
          import {execFileSync} from 'node:child_process';
          const sha=process.env.CONTAOS_FRONTEND_SHA;
          if(!/^[a-f0-9]{40}$/.test(sha||'')||!/^dpl_[A-Za-z0-9]{8,80}$/.test(process.env.CONTAOS_DEPLOYMENT_ID||''))process.exit(1);
          if(execFileSync('git',['cat-file','-t',sha],{encoding:'utf8'}).trim()!=='commit')process.exit(1);
          execFileSync('git',['merge-base','--is-ancestor',sha,'origin/main']);
          JS
      - name: Fonte aprovada em checkout separado, sem credenciais persistidas
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.deployment.outputs.frontend_sha }}
          path: frontend-source
          fetch-depth: 0
          persist-credentials: false
      - name: Dependencias congeladas da fonte aprovada
        working-directory: frontend-source
        run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: trilha-a-ubuntu22-playwright-1.58.2-1208
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Barreira nativa no mesmo HEAD antes de secrets
        run: node scripts/hml/authenticated-visual-audit.mjs --native-guard
      - name: Preparacao e SSR sem credenciais privadas
        run: node scripts/hml/authenticated-visual-audit.mjs --prepare
      - name: Axe isolado e fixado, sem alterar dependencias do produto
        run: |
          npm install --prefix "$RUNNER_TEMP/contaos-trilha-a-axe" --ignore-scripts --no-save --no-package-lock axe-core@4.14.0
          test -s "$RUNNER_TEMP/contaos-trilha-a-axe/node_modules/axe-core/axe.min.js"
          echo "CONTAOS_AXE_SOURCE_PATH=$RUNNER_TEMP/contaos-trilha-a-axe/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"
      - name: Revalidar main e unicidade dentro da concorrencia antes de secrets
        if: github.event_name == 'workflow_run'
        env:
          CONTAOS_ACTIONS_READ_TOKEN: ${{ github.token }}
        run: node scripts/hml/authenticated-visual-audit.mjs --request-revalidate
      - name: Somente agora fornecer o par sintetico ao auditor
        env:
          CONTAOS_HML_SYNTHETIC_EMAIL: ${{ secrets.CONTAOS_HML_SYNTHETIC_EMAIL }}
          CONTAOS_HML_SYNTHETIC_PASSWORD: ${{ secrets.CONTAOS_HML_SYNTHETIC_PASSWORD }}
        run: node scripts/hml/authenticated-visual-audit.mjs --audit
      - name: Verificar hashes gerados, inclusive em resultado parcial
        if: always()
        working-directory: artifacts/trilha-a-private
        run: sha256sum --check SHA256SUMS
      - name: Evidencia privada imutavel por 90 dias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trilha-a-private-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/trilha-a-private/
          retention-days: 90
          if-no-files-found: error
