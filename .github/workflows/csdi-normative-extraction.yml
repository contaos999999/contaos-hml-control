name: CSDI Normative Extraction (26 canonical sources)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/csdi-normative-extractor.mjs'
      - '.github/workflows/csdi-normative-extraction.yml'
      - 'docs/frontend/CONTEXT_CANONICO_4_1_SNAPSHOT.json'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate extractor syntax
        run: node --check scripts/csdi-normative-extractor.mjs
      - name: Extract all 26 immutable canonical sources
        env:
          CONTAOS_CANONICAL_READ_TOKEN: ${{ secrets.CONTAOS_CANONICAL_READ_TOKEN }}
        run: node scripts/csdi-normative-extractor.mjs csdi-normative-extraction.json
      - name: Upload traceable extraction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csdi-normative-extraction-${{ github.sha }}-${{ github.run_attempt }}
          path: csdi-normative-extraction.json
          if-no-files-found: error
          retention-days: 30
