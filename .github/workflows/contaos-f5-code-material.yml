name: ContaOS F5 CODE - provas materiais parciais
on:
  pull_request:
    branches: [main]
    paths:
      - "src/test/f5-code-*.test.*"
      - "scripts/hml/f5-code-material-evidence*"
      - ".github/workflows/contaos-f5-code-material.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  context:
    name: F5 CODE context - material e isolamento
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Instalar Bun fixado
        run: |
          node --test scripts/ci/install-pinned-bun.test.mjs
          node scripts/ci/install-pinned-bun.mjs
      - run: bun install --frozen-lockfile
      - name: Autotestes e provas reais de contexto
        env:
          F5_CONTEXT_OBSERVATIONS: artifacts/f5-code/observations.json
        run: |
          set -euo pipefail
          node --test scripts/hml/f5-code-material-evidence.test.mjs
          mkdir -p artifacts/f5-code
          export F5_HARNESS_SHA="$(git hash-object scripts/hml/f5-code-material-evidence.mjs)"
          bunx vitest run src/test/f5-code-context-session-isolation.test.tsx --reporter=json --outputFile=artifacts/f5-code/vitest.json
      - name: Validar material parcial e proveniência
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export F5_HARNESS_SHA="$(git hash-object scripts/hml/f5-code-material-evidence.mjs)"
          JOB_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="F5 CODE context - material e isolamento") | .id')"
          export JOB_ID
          node scripts/hml/f5-code-material-evidence.mjs --batch context
          cd artifacts/f5-code
          sha256sum observations.json vitest.json receipt.json > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f5-code-context-${{ github.sha }}
          path: artifacts/f5-code/
          if-no-files-found: warn
          retention-days: 30
